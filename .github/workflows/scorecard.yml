name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

# Scorecard needs repository-level tokens a fork PR cannot have, so this never runs on
# pull_request.
permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # A job-level permissions block REPLACES the workflow-level one rather than merging with
      # it, so the contents: read above does not carry down here. Without this line checkout
      # gets a 404 on a private repo, which reads as "repository not found" and not as a
      # permission error.
      contents: read
      # Needed to upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Needed for the GitHub OIDC token that publish_results: true requires.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
