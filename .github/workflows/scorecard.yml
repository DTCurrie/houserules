name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

# Scorecard needs repository-level tokens a fork PR cannot have, so this never runs on
# pull_request.
permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # A job-level permissions block REPLACES the workflow-level one rather than merging with
      # it, so the contents: read above does not carry down here. Without this line checkout
      # gets a 404 on a private repo, which reads as "repository not found" and not as a
      # permission error.
      contents: read
      # Needed to upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Needed for the GitHub OIDC token that publish_results: true requires.
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
