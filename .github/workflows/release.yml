name: Release

# Changesets release flow: on every push to main, this either (a) opens/updates a
# "Version Packages" PR that runs `changeset version`, or (b) if that PR was just
# merged, publishes to npm with `changeset publish`.
#
# One-time setup (manual): add an NPM_TOKEN repo secret with publish rights.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No version input. pnpm/action-setup reads the root package.json packageManager
      # field, so the pinned version has one source of truth that local runs share.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      # `changeset publish` reaches each package's build through its `prepack`, which runs
      # wireit. Sharing the cache means publishing does not recompile what CI already built.
      - uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
