name: Release

# Changesets release flow: on every push to main, this either (a) opens/updates a
# "Version Packages" PR that runs `changeset version`, or (b) if that PR was just
# merged, publishes to npm with `changeset publish`.
#
# One-time setup (manual): add an NPM_TOKEN repo secret with publish rights.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version input. pnpm/action-setup reads the root package.json packageManager
      # field, so the pinned version has one source of truth that local runs share.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      # `changeset publish` reaches each package's build through its `prepack`, which runs
      # wireit. Sharing the cache means publishing does not recompile what CI already built.
      - uses: google/wireit@setup-github-actions-caching/v2
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
