name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write
  # Only required on a private repo. The analyze step reads its own workflow run through the
  # Actions API, and without this it fails at upload with "Resource not accessible by
  # integration" after the queries have already succeeded.
  actions: read

jobs:
  analyze:
    # A changesets "Version Packages" PR touches only versions, changelogs, and consumed
    # .changeset entries, nothing CodeQL analyzes, so skip it. Job-level because the
    # trigger-level `branches` filter matches the base branch. GitHub reports a skipped job
    # as passing for required status checks. head_ref is empty outside pull_request, so
    # pushes and the schedule still run.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # javascript-typescript is interpreted, so build-mode: none skips the build step
      # entirely instead of running autobuild against a repo with no compiled output.
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: '/language:javascript-typescript'
