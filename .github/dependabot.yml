version: 2
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages/*'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    # Workaround for dependabot/dependabot-core#15698, open upstream. Refreshing a pull request
    # that spans multiple directories crashes the updater with "Assertion failed: Current
    # directory not set", so every push to main fails a Dependabot run. The create path is
    # unaffected and the pull requests themselves are correct. Only the rebase is broken, so
    # turning the rebase off is what stops the failures. Drop this once the bug is fixed.
    rebase-strategy: 'disabled'
    groups:
      # group-by dependency-name collapses one bump across all thirteen
      # workspace packages into a single PR instead of one per directory.
      dev-dependencies:
        dependency-type: 'development'
        group-by: 'dependency-name'
      production-dependencies:
        dependency-type: 'production'
        group-by: 'dependency-name'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      # changesets/action v2 requires @changesets/cli v3; this repo is on v2. Lift this
      # when the CLI is upgraded to v3, and rename the action's version/publish inputs
      # to version-script/publish-script in release.yml at the same time.
      - dependency-name: 'changesets/action'
        update-types: ['version-update:semver-major']
    groups:
      github-actions:
        patterns:
          - '*'
